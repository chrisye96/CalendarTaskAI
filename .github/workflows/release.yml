name: Build release

# Triggered by pushing a git tag matching `v*` (e.g. `v1.0.0`).
# The workflow runs the same `build_release.py` we use locally, then
# uploads the resulting zip and attaches it to a GitHub Release.
#
# Manual dispatch is also supported for dry-run testing without tagging.

on:
  push:
    tags:
      # Restrict to versioned tags only. Plain `v*` would also match
      # ad-hoc tags like `vendor` or `v-experiment` and accidentally
      # cut a release.
      - "v[0-9]*"
  workflow_dispatch:

permissions:
  contents: write  # needed by softprops/action-gh-release to create releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Default `cache: pip` only hashes `requirements.txt`.
          # We also want a bump in `requirements-dev.txt` (e.g. a new
          # PyInstaller version) to invalidate the cache; otherwise CI
          # would silently build with the stale cached install.
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        # Sanity check the same suite we expect to pass on main before
        # building a release artifact. A failing test fails the release.
        run: pytest tests/ -q

      - name: Build release bundle
        run: python build_release.py

      - name: Extract latest changelog section
        # Pull just the topmost `## v...` section out of CHANGELOG.md and
        # write it to release-body.md, stripping the version heading so we
        # don't duplicate the title GitHub already shows. The release step
        # below uses this file as the release body so future tags ship the
        # curated CHANGELOG content instead of an auto-generated PR list.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import pathlib, re
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(r"^## .+?(?=^## |\Z)", text, flags=re.MULTILINE | re.DOTALL)
          if not match:
              raise SystemExit("No `## ...` section found in CHANGELOG.md")
          body = re.sub(r"^## .+?\n", "", match.group(0), count=1)
          pathlib.Path("release-body.md").write_text(body.strip() + "\n", encoding="utf-8")

      - name: Upload artifact (always)
        # Always attach the zip to the workflow run so a manual dispatch
        # produces something downloadable even without a release.
        uses: actions/upload-artifact@v4
        with:
          name: CalendarTaskAI-zip
          path: dist/CalendarTaskAI-v*.zip
          if-no-files-found: error

      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CalendarTaskAI-v*.zip
          body_path: release-body.md
          draft: true       # human reviews the body before publishing
          prerelease: false
